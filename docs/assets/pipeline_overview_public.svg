<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img" aria-labelledby="title desc">
  <title id="title">RTBioScan public pipeline overview</title>
  <desc id="desc">Public overview of RTBioScan showing POD5 reads flowing through FAST pre-filter, HAC basecalling, demultiplexing and quality filtering, OTU definition, OTU taxonomic assignment, consensus generation, and live reports and result files. Reference databases feed taxonomic assignment. Sample metadata and barcode or primer FASTA feed demultiplexing. Optional reporting or highlighting resources such as GBIF or iNaturalist are separated from the core classification flow. The workflow repeats per round and preserves cumulative state for resume and restart.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbfcfe"/>
      <stop offset="100%" stop-color="#eef4fb"/>
    </linearGradient>
    <linearGradient id="dbFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7f0df"/>
      <stop offset="100%" stop-color="#f4dfb5"/>
    </linearGradient>
    <linearGradient id="optionalFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef9ef"/>
      <stop offset="100%" stop-color="#d8f0dc"/>
    </linearGradient>
    <linearGradient id="inputFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#edf6ff"/>
      <stop offset="100%" stop-color="#d8ebff"/>
    </linearGradient>
    <linearGradient id="outputFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6efe7"/>
      <stop offset="100%" stop-color="#f2ddc5"/>
    </linearGradient>
    <linearGradient id="stageA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8eef6"/>
      <stop offset="100%" stop-color="#bce2f0"/>
    </linearGradient>
    <linearGradient id="stageB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dce8f8"/>
      <stop offset="100%" stop-color="#c6daf6"/>
    </linearGradient>
    <linearGradient id="stageC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5e2fb"/>
      <stop offset="100%" stop-color="#d6d0fa"/>
    </linearGradient>
    <linearGradient id="stageD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1e1f8"/>
      <stop offset="100%" stop-color="#ead0f5"/>
    </linearGradient>
    <linearGradient id="stageE" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9e1ef"/>
      <stop offset="100%" stop-color="#f4cbdf"/>
    </linearGradient>
    <linearGradient id="stageF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbe6de"/>
      <stop offset="100%" stop-color="#f5d0c0"/>
    </linearGradient>
    <linearGradient id="stageG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8eedb"/>
      <stop offset="100%" stop-color="#f0deba"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#35506b" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#527a9e"/>
    </marker>
    <marker id="arrowSoft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#7aa57f"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, Helvetica, sans-serif; fill: #24384b; }
      .subtitle { font: 500 18px Arial, Helvetica, sans-serif; fill: #47657f; }
      .panel { stroke: #d7e2ed; stroke-width: 2; }
      .stage { stroke: #ffffff; stroke-width: 2; rx: 28; ry: 28; filter: url(#shadow); }
      .box { stroke: #cfd9e3; stroke-width: 2; rx: 24; ry: 24; filter: url(#shadow); }
      .label { font: 700 20px Arial, Helvetica, sans-serif; fill: #22384a; }
      .small { font: 500 16px Arial, Helvetica, sans-serif; fill: #49657e; }
      .tiny { font: 500 14px Arial, Helvetica, sans-serif; fill: #5d768d; }
      .stageText { font: 700 19px Arial, Helvetica, sans-serif; fill: #22384a; text-anchor: middle; }
      .stageSub { font: 500 14px Arial, Helvetica, sans-serif; fill: #4f6980; text-anchor: middle; }
      .flow { stroke: #527a9e; stroke-width: 7; fill: none; stroke-linecap: round; marker-end: url(#arrow); }
      .feed { stroke: #789867; stroke-width: 5; fill: none; stroke-linecap: round; marker-end: url(#arrowSoft); }
      .optional { stroke: #7aa57f; stroke-width: 4; fill: none; stroke-linecap: round; stroke-dasharray: 12 10; marker-end: url(#arrowSoft); }
      .roundNote { font: 600 18px Arial, Helvetica, sans-serif; fill: #28445c; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="780" fill="url(#bg)"/>

  <text x="80" y="74" class="title">RTBioScan Public Pipeline Overview</text>
  <text x="80" y="110" class="subtitle">User-facing workflow only. Internal reporting helpers and state-finalization steps are intentionally omitted.</text>

  <rect x="70" y="145" width="1460" height="560" rx="34" ry="34" fill="#ffffff" class="panel"/>

  <rect x="90" y="182" width="255" height="104" fill="url(#dbFill)" class="box"/>
  <text x="118" y="220" class="label">Reference databases</text>
  <text x="118" y="251" class="small">Marker-specific reference DBs</text>
  <text x="118" y="275" class="tiny">and taxonomy tables</text>
  <text x="118" y="298" class="tiny">Examples: BOLD, NCBI taxonomy</text>

  <rect x="1260" y="182" width="245" height="104" fill="url(#optionalFill)" class="box"/>
  <text x="1288" y="220" class="label">Optional reporting</text>
  <text x="1288" y="251" class="small">highlighting resources</text>
  <text x="1288" y="275" class="tiny">Examples: local GBIF / iNaturalist</text>
  <text x="1288" y="298" class="tiny">genus lists for profile-specific reports</text>

  <rect x="82" y="516" width="222" height="92" fill="url(#inputFill)" class="box"/>
  <text x="109" y="551" class="label">POD5 reads</text>
  <text x="109" y="579" class="small">Realtime or batch input</text>

  <rect x="453" y="522" width="262" height="84" fill="url(#inputFill)" class="box"/>
  <text x="481" y="555" class="label">Sample metadata</text>
  <text x="481" y="582" class="small">Barcode / primer FASTA</text>

  <rect x="1260" y="516" width="248" height="92" fill="url(#outputFill)" class="box"/>
  <text x="1287" y="548" class="label">Outputs</text>
  <text x="1287" y="575" class="small">Live HTML reports, summary tables,</text>
  <text x="1287" y="598" class="small">consensus FASTA and result files</text>

  <rect x="110" y="355" width="170" height="98" fill="url(#stageA)" class="stage"/>
  <text x="195" y="394" class="stageText">FAST pre-filter</text>
  <text x="195" y="419" class="stageSub">target read selection</text>

  <rect x="315" y="355" width="160" height="98" fill="url(#stageB)" class="stage"/>
  <text x="395" y="394" class="stageText">HAC</text>
  <text x="395" y="419" class="stageSub">basecalling</text>

  <rect x="510" y="355" width="210" height="98" fill="url(#stageC)" class="stage"/>
  <text x="615" y="394" class="stageText">Demultiplexing</text>
  <text x="615" y="419" class="stageSub">+ HQ filtering</text>

  <rect x="755" y="355" width="170" height="98" fill="url(#stageD)" class="stage"/>
  <text x="840" y="394" class="stageText">OTU</text>
  <text x="840" y="419" class="stageSub">definition</text>

  <rect x="960" y="355" width="206" height="98" fill="url(#stageE)" class="stage"/>
  <text x="1063" y="394" class="stageText">OTU taxonomic</text>
  <text x="1063" y="419" class="stageSub">assignment</text>

  <rect x="1201" y="355" width="176" height="98" fill="url(#stageF)" class="stage"/>
  <text x="1289" y="394" class="stageText">Consensus</text>
  <text x="1289" y="419" class="stageSub">generation</text>

  <rect x="1412" y="355" width="88" height="98" fill="url(#stageG)" class="stage"/>
  <text x="1456" y="393" class="stageText">Live</text>
  <text x="1456" y="418" class="stageSub">results</text>

  <path d="M304 404 H315" class="flow"/>
  <path d="M475 404 H510" class="flow"/>
  <path d="M720 404 H755" class="flow"/>
  <path d="M925 404 H960" class="flow"/>
  <path d="M1166 404 H1201" class="flow"/>
  <path d="M1377 404 H1412" class="flow"/>

  <path d="M304 562 C360 562, 372 562, 420 562 C450 562, 460 520, 510 435" class="feed"/>
  <path d="M218 516 C218 486, 204 476, 196 454" class="feed"/>
  <path d="M217 451 L217 452" class="feed"/>

  <path d="M218 286 C218 314, 410 314, 1018 314 C1040 314, 1052 336, 1062 352" class="feed"/>
  <path d="M1383 286 C1383 322, 1383 322, 1383 348" class="optional"/>
  <path d="M1500 404 C1518 404, 1524 440, 1504 490 C1488 527, 1478 534, 1454 547" class="feed"/>

  <text x="118" y="337" class="tiny">Core taxonomic assignment support</text>
  <text x="1235" y="338" class="tiny">Separate from core classification flow</text>

  <rect x="360" y="640" width="880" height="40" rx="20" ry="20" fill="#e8f1fb" stroke="#c8d9ea" stroke-width="2"/>
  <text x="400" y="666" class="roundNote">Repeated per round; cumulative state preserved for resume/restart.</text>
</svg>
